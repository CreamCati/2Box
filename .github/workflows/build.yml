name: Build 2Box CPU Auto

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build Release x64
        shell: cmd
        run: msbuild 2Box.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 2Box-CPU-Auto-x64
          path: |
            bin/x64/**
            bin/Release/x64/**
